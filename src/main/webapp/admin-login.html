<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Hospital Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            background: linear-gradient(to bottom right, #f0f7ff, #ffffff);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .form-container {
            max-width: 500px;
        }

        .form-card {
            backdrop-filter: blur(16px);
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .security-badge {
            background-color: #fef3c7;
            color: #92400e;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-gradient-indigo {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
        }

        .icon-white {
            color: white;
            width: 30px;
            height: 30px;
        }

        .btn-gradient-indigo {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-gradient-indigo:hover {
            transform: scale(1.02);
            color: white;
        }

        .form-control,
        .form-select {
            height: 50px;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="container form-container">
        <div class="form-card">
            <div class="text-center mb-4">
                <div class="logo-icon mx-auto mb-3 bg-gradient-indigo">
                    <i data-lucide="shield-check" class="icon-white"></i>
                </div>

                <h2 class="fw-bold mb-2">Admin Login</h2>
                <p class="text-muted">Secure access for hospital staff</p>

                <div class="security-badge mx-auto" style="width: fit-content;">
                    <i data-lucide="lock" style="width: 16px; height: 16px;"></i>
                    <span>Secure Connection</span>
                </div>
            </div>

            <form action="adminLogin" method="post">
                <div class="mb-3">
                    <label class="form-label">Admin Email</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <div class="mb-3 form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">
                        Remember this device
                    </label>
                </div>

                <button type="submit" class="btn btn-gradient-indigo w-100 mb-3">Login to Dashboard</button>
            </form>

            <div class="text-center mt-4">
                <a href="#" class="text-decoration-none d-block mb-2">Forgot Admin Password?</a>
                <a href="index.html" class="text-muted text-decoration-none">&larr; Back to Home</a>
            </div>

            <div class="alert alert-warning mt-4 mb-0" role="alert">
                <small><strong>Security Notice:</strong> This area is restricted to authorized personnel only. All login attempts are monitored and logged.</small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
