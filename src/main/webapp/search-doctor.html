<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Doctor | Hospital Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#eef4ff,#ffffff,#f5f8ff);
            font-family:'Segoe UI',sans-serif;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:30px;
        }

        .search-card{

            width:100%;
            max-width:720px;

            background:rgba(255,255,255,0.88);
            backdrop-filter:blur(18px);

            border-radius:32px;

            padding:45px;

            border:1px solid rgba(255,255,255,0.7);

            box-shadow:
            0 20px 60px rgba(15,23,42,0.10);

            position:relative;
            overflow:hidden;
        }

        .search-card::before{
            content:"";
            position:absolute;
            width:280px;
            height:280px;
            background:rgba(37,99,235,0.08);
            border-radius:50%;
            top:-120px;
            right:-100px;
        }

        .top-badge{
            display:inline-flex;
            align-items:center;
            gap:8px;

            background:#dbeafe;
            color:#2563eb;

            padding:10px 18px;
            border-radius:999px;

            font-weight:700;

            margin-bottom:18px;
        }

        .icon-box{

            width:78px;
            height:78px;

            margin:auto;

            border-radius:24px;

            background:
            linear-gradient(135deg,#2563eb,#7c3aed);

            display:flex;
            align-items:center;
            justify-content:center;

            box-shadow:
            0 18px 35px rgba(37,99,235,0.25);

            margin-bottom:22px;
        }

        .icon-box svg{
            width:34px;
            height:34px;
            color:white;
        }

        .title{
            font-size:clamp(2rem,4vw,3.4rem);
            font-weight:900;
            line-height:1.08;
            color:#0f172a;
            margin-bottom:12px;
        }

        .title span{
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .subtitle{
            color:#64748b;
            font-size:1.05rem;
            line-height:1.8;
            max-width:620px;
            margin:auto;
            margin-bottom:35px;
        }

        .form-label{
            font-weight:700;
            color:#1e293b;
            margin-bottom:10px;
        }

        .search-input{

            height:60px;

            border-radius:18px;

            border:1px solid #dbeafe;

            background:#f8fbff;

            padding-left:18px;

            font-size:16px;

            transition:0.3s;
        }

        .search-input:focus{
            border-color:#2563eb;

            box-shadow:
            0 0 0 4px rgba(37,99,235,0.12);
        }

        .search-btn{

            width:100%;
            height:60px;

            border:none;
            border-radius:18px;

            background:
            linear-gradient(135deg,#2563eb,#7c3aed);

            color:white;

            font-size:18px;
            font-weight:800;

            transition:0.3s;

            box-shadow:
            0 14px 30px rgba(37,99,235,0.20);
        }

        .search-btn:hover{
            transform:translateY(-2px);
        }

        .helper-text{
            margin-top:10px;
            color:#94a3b8;
            font-size:14px;
        }

        .back-link{
            display:inline-block;
            margin-top:22px;
            text-decoration:none;
            color:#64748b;
            font-weight:600;
        }

        .back-link:hover{
            color:#2563eb;
        }

        @media(max-width:768px){

            .search-card{
                padding:28px 20px;
            }

        }

    </style>

</head>
<body>

<div class="search-card">

    <div class="text-center">

        <div class="top-badge">
            <i data-lucide="search"></i>
            Smart Doctor Search
        </div>

        <div class="icon-box">
            <i data-lucide="stethoscope"></i>
        </div>

        <h1 class="title">
            Search <span>Doctors</span>
        </h1>

        <p class="subtitle">
            Search doctors quickly using doctor name,
            specialization, mobile number or email address.
        </p>

    </div>

    <form action="searchDoctor" method="get">

        <div class="mb-4">

            <label class="form-label">
                Search Keyword
            </label>

            <input type="text"
                   name="keyword"
                   class="form-control search-input"
                   placeholder="Enter Name / Specialization / Mobile / Email"
                   required>

            <div class="helper-text">
                Example: Cardiologist, 9876543210, doctor@gmail.com
            </div>

        </div>

        <button type="submit" class="search-btn">
            Search Doctor
        </button>

    </form>

    <div class="text-center">

        <a href="admin-dashboard.html" class="back-link">
            ← Back to Dashboard
        </a>

    </div>

</div>

<script>
    lucide.createIcons();
</script>

</body>
</html>
