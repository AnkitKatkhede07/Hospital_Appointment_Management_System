<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Doctor - Admin Panel</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>

        body{
            background: linear-gradient(to bottom right,#eef4ff,#f8fbff);
            font-family: 'Segoe UI', sans-serif;
            min-height:100vh;
        }

        .doctor-container{
            padding:60px 20px;
        }

        .doctor-card{
            max-width:700px;
            margin:auto;

            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(18px);

            border-radius:30px;
            padding:45px;

            box-shadow:
            0 20px 60px rgba(0,0,0,0.08);

            border:1px solid rgba(255,255,255,0.5);
        }

        .badge-top{
            display:inline-flex;
            align-items:center;
            gap:10px;

            background:#dbeafe;
            color:#2563eb;

            padding:10px 18px;
            border-radius:50px;

            font-weight:600;
            margin-bottom:25px;
        }

        .main-title{
            font-size:52px;
            font-weight:800;
            line-height:1.1;
            color:#0f172a;
            margin-bottom:10px;
        }

        .gradient-text{
            background: linear-gradient(to right,#2563eb,#7c3aed);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .subtitle{
            color:#64748b;
            font-size:18px;
            margin-bottom:35px;
        }

        .form-label{
            font-weight:700;
            color:#1e293b;
            margin-bottom:10px;
        }

        .form-control{
            height:58px;
            border-radius:16px;
            border:none;

            background:#f8fbff;

            padding-left:18px;

            box-shadow:
            inset 0 0 0 1px #dbeafe;
        }

        .form-control:focus{
            box-shadow:
            0 0 0 4px rgba(37,99,235,0.15);
        }

        .submit-btn{
            width:100%;
            height:60px;

            border:none;
            border-radius:18px;

            background: linear-gradient(to right,#2563eb,#7c3aed);

            color:white;
            font-size:18px;
            font-weight:700;

            margin-top:15px;

            transition:0.3s;
        }

        .submit-btn:hover{
            transform:translateY(-3px);
            box-shadow:
            0 15px 30px rgba(37,99,235,0.25);
        }

        .back-link{
            text-decoration:none;
            color:#64748b;
            font-weight:600;
        }

        .back-link:hover{
            color:#2563eb;
        }

    </style>

</head>
<body>

<div class="container doctor-container">

    <div class="doctor-card">

        <div class="text-center">

            <div class="badge-top">
                <i data-lucide="stethoscope"></i>
                Add New Doctor
            </div>

            <h1 class="main-title">
                Doctor <span class="gradient-text">Registration</span>
            </h1>

            <p class="subtitle">
                Add specialist doctors to the hospital management system
            </p>

        </div>

        <form action="addDoctor" method="post">

            <div class="row">

                <div class="col-md-6 mb-4">
                    <label class="form-label">
                        Doctor Name
                    </label>

                    <input type="text"
                           class="form-control"
                           name="name"
                           placeholder="Enter Doctor Name"
                           required>
                </div>

                <div class="col-md-6 mb-4">
                    <label class="form-label">
                        Specialization
                    </label>

                    <input type="text"
                           class="form-control"
                           name="specialization"
                           placeholder="Enter Specialization"
                           required>
                </div>

                <div class="col-md-6 mb-4">
                    <label class="form-label">
                        Mobile Number
                    </label>

                    <input type="text"
                           class="form-control"
                           name="mobile"
                           placeholder="Enter Mobile Number"
                           required>
                </div>

                <div class="col-md-6 mb-4">
                    <label class="form-label">
                        Email Address
                    </label>

                    <input type="email"
                           class="form-control"
                           name="email"
                           placeholder="Enter Email Address"
                           required>
                </div>

                <div class="col-12 mb-4">
                    <label class="form-label">
                        Consultation Fees
                    </label>

                    <input type="number"
                           class="form-control"
                           name="fees"
                           placeholder="Enter Fees"
                           required>
                </div>

            </div>

            <button type="submit" class="submit-btn">
                Add Doctor
            </button>

        </form>

        <div class="text-center mt-4">

            <a href="admin-dashboard.html" class="back-link">
                ← Back to Dashboard
            </a>

        </div>

    </div>

</div>

<script>
    lucide.createIcons();
</script>

</body>
</html>
