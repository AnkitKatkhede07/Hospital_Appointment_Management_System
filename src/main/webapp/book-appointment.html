<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | Hospital Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            font-family:'Segoe UI',sans-serif;
            background:linear-gradient(135deg,#eef4ff,#ffffff,#f5f8ff);
            display:flex;
            align-items:center;
            color:#0f172a;
        }

        .appt-wrap{
            max-width:720px;
        }

        .appt-card{
            background:rgba(255,255,255,0.88);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,0.7);
            border-radius:30px;
            padding:40px;
            box-shadow:0 20px 60px rgba(15,23,42,0.10);
        }

        .top-badge{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:10px 16px;
            border-radius:999px;
            background:#dbeafe;
            color:#2563eb;
            font-weight:700;
            margin-bottom:18px;
        }

        .icon-box{
            width:72px;
            height:72px;
            border-radius:22px;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 18px;
            background:linear-gradient(135deg,#2563eb,#3b82f6);
            box-shadow:0 14px 30px rgba(37,99,235,0.22);
        }

        .icon-box svg{
            width:32px;
            height:32px;
            color:#fff;
        }

        .title{
            font-size:clamp(2rem,4vw,3.2rem);
            font-weight:900;
            line-height:1.08;
            letter-spacing:-0.03em;
            margin-bottom:10px;
        }

        .title span{
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .subtext{
            color:#64748b;
            font-size:1.05rem;
            line-height:1.7;
            margin-bottom:30px;
        }

        .form-label{
            font-weight:700;
            color:#1e293b;
            margin-bottom:8px;
        }

        .form-control,
        .form-select{
            height:54px;
            border-radius:14px;
            border:1px solid #dbeafe;
            background:#f8fbff;
            box-shadow:none;
            padding-left:16px;
        }

        .form-control:focus,
        .form-select:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 4px rgba(37,99,235,0.12);
        }

        .submit-btn{
            width:100%;
            height:56px;
            border:none;
            border-radius:16px;
            font-weight:800;
            color:#fff;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            box-shadow:0 14px 28px rgba(37,99,235,0.22);
            transition:0.3s;
        }

        .submit-btn:hover{
            transform:translateY(-2px);
            color:#fff;
        }

        .back-link{
            display:inline-block;
            margin-top:18px;
            color:#64748b;
            text-decoration:none;
            font-weight:600;
        }

        .back-link:hover{
            color:#2563eb;
        }

        .hint{
            font-size:0.92rem;
            color:#94a3b8;
            margin-top:6px;
        }

        @media(max-width:768px){
            .appt-card{
                padding:26px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container appt-wrap py-4 py-md-5">
        <div class="appt-card">

            <div class="text-center">
                <div class="top-badge">
                    <i data-lucide="calendar-plus"></i>
                    Appointment Booking
                </div>

                <div class="icon-box">
                    <i data-lucide="stethoscope"></i>
                </div>

                <h1 class="title">
                    Book Your <span>Appointment</span>
                </h1>

                <p class="subtext">
                    Enter doctor ID and choose your preferred date to book an appointment quickly and easily.
                </p>
            </div>

            <form action="bookAppointment" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Doctor ID</label>
                        <input type="number" name="doctorId" class="form-control" placeholder="Enter Doctor ID" required>
                        <div class="hint">Use the doctor ID from the doctor list.</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Appointment Date</label>
                        <input type="date" name="appointmentDate" class="form-control" required>
                        <div class="hint">Choose a future date only.</div>
                    </div>

                    <div class="col-12 mt-3">
                        <button type="submit" class="submit-btn">Book Appointment</button>
                    </div>
                </div>
            </form>

            <div class="text-center">
                <a href="patient-dashboard.html" class="back-link">← Back to Dashboard</a>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
