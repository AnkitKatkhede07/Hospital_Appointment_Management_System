<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login - Hospital Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            background: linear-gradient(to bottom right, #f0f7ff, #ffffff);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .form-container {
            max-width: 500px;
        }

        .form-card {
            backdrop-filter: blur(16px);
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-gradient-cyan {
            background: linear-gradient(135deg, #06b6d4, #22d3ee);
        }

        .icon-white {
            color: white;
            width: 30px;
            height: 30px;
        }

        .btn-gradient-cyan {
            background: linear-gradient(135deg, #06b6d4, #22d3ee);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-gradient-cyan:hover {
            transform: scale(1.02);
            color: white;
        }

        .form-control {
            height: 50px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <div class="container form-container">
        <div class="form-card">

            <!-- Heading -->
            <div class="text-center mb-4">

                <div class="logo-icon mx-auto mb-3 bg-gradient-cyan">
                    <i data-lucide="log-in" class="icon-white"></i>
                </div>

                <h2 class="fw-bold mb-2">Patient Login</h2>

                <p class="text-muted">
                    Welcome back! Please login to your account
                </p>

            </div>

            <!-- FORM START -->
            <form action="patientLogin" method="post">

                <!-- Mobile -->
                <div class="mb-3">
                    <label class="form-label">Mobile Number</label>

                    <input type="text"
                           name="mobile"
                           class="form-control"
                           placeholder="Enter Mobile Number"
                           required>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label">Password</label>

                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter your password"
                           required>
                </div>

                <!-- Remember -->
                <div class="mb-3 d-flex justify-content-between align-items-center">

                    <div class="form-check">
                        <input class="form-check-input"
                               type="checkbox"
                               id="remember">

                        <label class="form-check-label" for="remember">
                            Remember me
                        </label>
                    </div>

                    <a href="#" class="text-decoration-none">
                        Forgot Password?
                    </a>

                </div>

                <!-- Submit -->
                <button type="submit"
                        class="btn btn-gradient-cyan w-100 mb-3">

                    Login

                </button>

            </form>
            <!-- FORM END -->

            <!-- Footer -->
            <div class="text-center mt-4">

                <p class="text-muted">
                    Don't have an account?

                    <a href="patient-register.html"
                       class="text-decoration-none fw-semibold">

                        Register

                    </a>
                </p>

                <a href="index.html"
                   class="text-muted text-decoration-none">

                    &larr; Back to Home

                </a>

            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lucide Init -->
    <script>
        lucide.createIcons();
    </script>

</body>
</html>
